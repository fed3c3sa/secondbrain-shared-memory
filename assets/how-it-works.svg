<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111319"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56b6f7"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ecf8e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#56b6f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- LEFT: assistants -->
  <g>
    <rect x="48" y="78" width="290" height="204" rx="18" fill="#15181f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="72" y="116" fill="#8a8f98" font-size="13" letter-spacing="2" font-weight="700">YOUR AI ASSISTANTS</text>
    <text x="72" y="152" fill="#e8eaee" font-size="18" font-weight="600">Claude Code</text>
    <text x="72" y="182" fill="#e8eaee" font-size="18" font-weight="600">Claude Desktop</text>
    <text x="72" y="212" fill="#e8eaee" font-size="18" font-weight="600">Cursor &#183; VS Code</text>
    <text x="72" y="242" fill="#e8eaee" font-size="18" font-weight="600">ChatGPT &#183; Gemini</text>
  </g>

  <!-- MIDDLE: flow -->
  <g>
    <line x1="346" y1="150" x2="554" y2="150" stroke="#3ecf8e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="138" text-anchor="middle" fill="#3ecf8e" font-size="13" font-weight="700">remember</text>

    <line x1="554" y1="210" x2="346" y2="210" stroke="#56b6f7" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <text x="450" y="230" text-anchor="middle" fill="#56b6f7" font-size="13" font-weight="700">recall</text>

    <rect x="362" y="262" width="176" height="34" rx="17" fill="#0d0e12" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="450" y="284" text-anchor="middle" fill="#e8eaee" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npx secondbrain-connect</text>
  </g>

  <!-- RIGHT: SecondBrain -->
  <g>
    <rect x="562" y="78" width="290" height="204" rx="18" fill="#15181f" stroke="#ffffff" stroke-opacity="0.07"/>
    <!-- brain glyph -->
    <g stroke="#3ecf8e" stroke-width="2" fill="#3ecf8e">
      <line x1="612" y1="138" x2="648" y2="120"/><line x1="648" y1="120" x2="690" y2="132"/>
      <line x1="612" y1="138" x2="636" y2="168"/><line x1="636" y1="168" x2="690" y2="132"/>
      <line x1="636" y1="168" x2="672" y2="176"/><line x1="690" y1="132" x2="672" y2="176"/>
      <line x1="672" y1="176" x2="660" y2="206"/><line x1="636" y1="168" x2="660" y2="206"/>
      <circle cx="612" cy="138" r="5"/><circle cx="648" cy="120" r="5"/><circle cx="690" cy="132" r="5"/>
      <circle cx="636" cy="168" r="5"/><circle cx="672" cy="176" r="5"/><circle cx="660" cy="206" r="5"/>
    </g>
    <text x="722" y="150" fill="#e8eaee" font-size="22" font-weight="700">SecondBrain</text>
    <text x="722" y="178" fill="#8a8f98" font-size="14">your persistent memory</text>
    <text x="586" y="242" fill="#cfd3da" font-size="14.5">Notes &#183; folders &#183; calendar</text>
    <text x="586" y="266" fill="#8a8f98" font-size="13">One memory, shared by every assistant</text>
  </g>

  <text x="450" y="332" text-anchor="middle" fill="#6b7280" font-size="13">Save a fact in one assistant &#183; recall it in another &#183; all in your own SecondBrain</text>
</svg>
